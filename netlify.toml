# Despliegue del sitio estatico de VetPet Surco en Netlify.
# No hay build: se publica la carpeta tal cual.

[build]
  publish = "sitio-web"
  command = ""

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

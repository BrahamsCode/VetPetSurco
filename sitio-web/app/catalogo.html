<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | VetPet Connect</title>
  <meta name="description" content="Prototipo de la plataforma VetPet Connect: catálogo.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <a class="saltar" href="#contenido">Saltar al contenido principal</a>

  <header class="encabezado" data-cabecera></header>

  <main id="contenido" class="panel">
    <div class="contenedor">
      <div class="panel-titulo">
        <h1>Catálogo</h1>
        <p>Precios en soles. El stock que ves es el stock real del inventario.</p>
      </div>

      <div class="bloque" style="margin-bottom:22px;">
        <div class="columnas" style="gap:18px;align-items:flex-end;">
          <div class="columna" style="flex:1 1 260px;">
            <label for="filtro" style="font-weight:700;font-size:14px;color:var(--verde-oscuro);display:block;margin-bottom:6px;">Categoría</label>
            <select id="filtro" class="horario" style="width:100%;padding:11px 14px;">
              <option value="">Todas las categorías</option>
              <option value="ALIMENTO">Alimento</option>
              <option value="ACCESORIO">Accesorios</option>
              <option value="MEDICAMENTO">Medicamentos</option>
              <option value="ARENA">Arena</option>
            </select>
          </div>
          <div class="columna" style="flex:1 1 220px;">
            <p style="margin:0;font-size:14px;color:var(--gris);">
              En el carrito: <strong id="contador-carrito" style="color:var(--verde-oscuro);">0</strong> unidades.
              <a href="carrito.html">Ver carrito</a>
            </p>
          </div>
        </div>
      </div>

      <div class="aviso" id="aviso-catalogo" hidden></div>
      <div class="rejilla rejilla-3" id="lista-productos"></div>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor pie-final">
      <p>Prototipo académico de VetPet Connect &mdash; Curso de E-business, Equipo 4, 2026.
         Los datos se guardan solo en este navegador.</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pagina-catalogo.js"></script>
</body>
</html>

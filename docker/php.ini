; Ajustes de PHP para el contenedor de la aplicacion.
memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 20M
post_max_size = 24M

date.timezone = America/Lima

; No anunciar la version de PHP en las cabeceras.
expose_php = Off

; En desarrollo conviene que opcache revalide los archivos al cambiarlos.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Los errores se escriben al log del contenedor, no a la respuesta HTTP.
display_errors = Off
log_errors = On
error_log = /dev/stderr

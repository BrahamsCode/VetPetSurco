; Ajustes de PHP para VetPet Connect (entorno de desarrollo con Docker).
; Este archivo se carga como /usr/local/etc/php/conf.d/vetpet.ini y por eso
; sobrescribe los valores por defecto de la imagen oficial.

; --- Límites generales ---------------------------------------------------------
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; --- Subida de archivos (fichas de mascotas, imágenes de productos) -------------
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; --- Zona horaria y errores ----------------------------------------------------
date.timezone = America/Lima
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL

; --- OPcache -------------------------------------------------------------------
; validate_timestamps se deja activo: en desarrollo el código se monta como
; volumen y debe recargarse al editarlo. En producción conviene ponerlo en 0.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

# Nginx para VetPet Connect: sirve public/ y delega los .php a php-fpm (app:9000).
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Laravel siempre se sirve desde public/, nunca desde la raíz del proyecto.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Debe acompañar a upload_max_filesize/post_max_size de php.ini.
    client_max_body_size 24M;

    access_log /var/log/nginx/vetpet-access.log;
    error_log  /var/log/nginx/vetpet-error.log;

    # Enrutado de Laravel: si el archivo no existe, lo resuelve index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Separa la ruta extra (/index.php/algo) antes de pasar a FPM.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # "app" es el nombre del servicio de PHP-FPM en compose.yaml.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # Nada de archivos ocultos (.env, .git, ...), salvo /.well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

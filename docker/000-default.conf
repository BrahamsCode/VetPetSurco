# Apache en HTTP. La raiz apunta a public/ de Laravel, nunca a /var/www,
# para que nadie pueda pedir .env ni el codigo por HTTP.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deniega el acceso a cualquier archivo oculto (.env, .git, ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

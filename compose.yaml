# Entorno de desarrollo de VetPet Connect.
#
#   app    -> PHP 8.2 FPM con el código de Laravel (imagen propia)
#   nginx  -> servidor web, publica http://localhost:8080
#   db     -> MySQL 8.0 con volumen persistente
#
# Levantar todo:  make up   (o: docker compose up -d --build)

name: vetpet-connect

services:
  # Aplicación Laravel sobre PHP-FPM. Escucha en el puerto 9000 de la red interna.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: vetpet-connect-app:8.2
    container_name: vetpet_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: vetpet_connect
      DB_USERNAME: vetpet
      DB_PASSWORD: vetpet
    volumes:
      # El código se monta para poder editarlo sin reconstruir la imagen.
      - .:/var/www/html
      # Mismo destino que el COPY del Dockerfile, para editar los ajustes en caliente.
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/vetpet.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vetpet

  # Servidor web: sirve public/ y pasa los .php a app:9000.
  nginx:
    image: nginx:alpine
    container_name: vetpet_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - vetpet

  # Base de datos de desarrollo. Los datos sobreviven a docker compose down.
  db:
    image: mysql:8.0
    container_name: vetpet_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: vetpet_connect
      MYSQL_USER: vetpet
      MYSQL_PASSWORD: vetpet
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Puerto 3307 en el host para no chocar con un MySQL instalado localmente.
      - "3307:3306"
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      # app no arranca hasta que este ping responde (condition: service_healthy).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vetpet

volumes:
  datos-mysql:
    driver: local

networks:
  vetpet:
    driver: bridge

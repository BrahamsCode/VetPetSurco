# Verificacion del proyecto en cada push y pull request.
name: Verificar proyecto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel sobre PHP 8.2
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vetpet_connect_test
          MYSQL_USER: vetpet
          MYSQL_PASSWORD: vetpet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # La version de PHP del contenedor de produccion, no otra.
      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip, gd
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar las pruebas de las 20 reglas de negocio
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: vetpet_connect_test
          DB_USERNAME: vetpet
          DB_PASSWORD: vetpet
        run: php artisan test

  docker:
    name: Configuracion de Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aqui si hay demonio de Docker: se comprueba lo que en el entorno de
      # desarrollo no se pudo, que la imagen de PHP 8.2 realmente construye.
      - name: Validar compose.yaml
        run: docker compose config --quiet

      - name: Construir la imagen de la aplicacion
        run: docker compose build app

  carrito-java:
    name: Carrito de compras (Entrega 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Se conserva como evidencia de la Entrega 2, ya superada por
      # app/Services en la aplicacion Laravel.
      - name: Compilar y ejecutar la demostracion
        working-directory: backend
        run: |
          javac -d out src/pe/vetpetsurco/carrito/*.java
          java -cp out pe.vetpetsurco.carrito.DemoCarrito

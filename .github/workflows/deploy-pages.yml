# Publica la carpeta sitio-web/ en GitHub Pages.
# Requiere que en Settings -> Pages la fuente sea "GitHub Actions".
name: Desplegar sitio web

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'sitio-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que ya esta en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        id: configuracion
        uses: actions/configure-pages@v5
        with:
          # Intenta habilitar Pages automaticamente. Solo funciona si el
          # token del flujo tiene permiso de administracion sobre el
          # repositorio; si no, hay que activarlo una vez a mano.
          enablement: true

      - name: Como activar Pages si el paso anterior fallo
        if: failure() && steps.configuracion.outcome == 'failure'
        run: |
          {
            echo "## Falta activar GitHub Pages"
            echo ""
            echo "El token de Actions no tiene permiso para crear el sitio."
            echo "Se activa una sola vez y de forma manual:"
            echo ""
            echo "1. Abre **Settings -> Pages** en este repositorio."
            echo "2. En **Source**, elige **GitHub Actions**."
            echo "3. Vuelve a **Actions** y re-ejecuta el flujo *Desplegar sitio web*."
            echo ""
            echo "A partir de ahi cada push a \`sitio-web/\` se publica solo."
            echo ""
            echo "Alternativa sin configuracion: arrastra la carpeta \`sitio-web/\`"
            echo "a https://app.netlify.com/drop"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages aun no esta activado. Revisa el resumen del flujo."

      - name: Empaquetar el sitio estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio-web

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
